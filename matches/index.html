<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BGMI Matches | eSports World Central</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: #ffffff;
        }

        header {
            padding: 25px 20px;
            text-align: center;
            background: #111118;
            border-bottom: 1px solid #24242d;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            color: #999;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            margin: 0;
        }

        .search {
            width: 280px;
            max-width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #16161d;
            color: white;
            outline: none;
        }

        .search:focus {
            border-color: #777;
        }

        #matches {
            display: grid;
            gap: 18px;
        }

        .match-card {
            background: #15151c;
            border: 1px solid #292933;
            border-radius: 12px;
            padding: 20px;
        }

        .tournament {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            text-align: center;
            margin: 15px 0;
        }

        .team {
            flex: 1;
            font-size: 20px;
            font-weight: bold;
        }

        .vs {
            color: #777;
            font-size: 14px;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            border-top: 1px solid #292933;
            padding-top: 15px;
            color: #aaa;
            font-size: 14px;
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #101017;
            text-align: center;
            font-weight: bold;
        }

        .loading,
        .empty,
        .error {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .error {
            color: #ff7777;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 24px;
            }

            .teams {
                gap: 10px;
            }

            .team {
                font-size: 17px;
            }

            .match-info {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>BGMI Matches</h1>
    <p>Match results and tournament battles</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>Matches</h2>

        <input
            type="text"
            id="search"
            class="search"
            placeholder="Search matches..."
        >
    </div>

    <div id="matches">
        <div class="loading">Loading matches...</div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://hoclvnypllnouypzymfx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_S7xT2BZ17bmFywJuUx-MTQ_N9cBTBso";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    let allMatches = [];

    async function loadMatches() {

        const container = document.getElementById("matches");

        const { data, error } = await supabaseClient
            .from("matches")
            .select(`
                id,
                match_date,
                result,
                tournaments (
                    name
                ),
                team_a:teams!matches_team_a_id_fkey (
                    name
                ),
                team_b:teams!matches_team_b_id_fkey (
                    name
                )
            `)
            .order("match_date", { ascending: false });

        if (error) {
            console.error(error);

            container.innerHTML = `
                <div class="error">
                    Unable to load matches.
                </div>
            `;

            return;
        }

        allMatches = data || [];

        displayMatches(allMatches);
    }

    function displayMatches(matches) {

        const container = document.getElementById("matches");

        if (!matches.length) {
            container.innerHTML = `
                <div class="empty">
                    No matches found.
                </div>
            `;

            return;
        }

        container.innerHTML = matches.map(match => {

            const tournament =
                match.tournaments?.name || "Unknown Tournament";

            const teamA =
                match.team_a?.name || "Team A";

            const teamB =
                match.team_b?.name || "Team B";

            const date = match.match_date
                ? new Date(match.match_date).toLocaleString()
                : "Date not available";

            const result =
                match.result || "Result not available";

            return `
                <div class="match-card">

                    <div class="tournament">
                        ${escapeHtml(tournament)}
                    </div>

                    <div class="teams">

                        <div class="team">
                            ${escapeHtml(teamA)}
                        </div>

                        <div class="vs">
                            VS
                        </div>

                        <div class="team">
                            ${escapeHtml(teamB)}
                        </div>

                    </div>

                    <div class="match-info">
                        <span>
                            📅 ${escapeHtml(date)}
                        </span>

                        <span>
                            Match #${match.id}
                        </span>
                    </div>

                    <div class="result">
                        ${escapeHtml(result)}
                    </div>

                </div>
            `;

        }).join("");
    }

    document.getElementById("search").addEventListener(
        "input",
        function () {

            const searchText = this.value
                .toLowerCase()
                .trim();

            const filtered = allMatches.filter(match => {

                const tournament =
                    match.tournaments?.name || "";

                const teamA =
                    match.team_a?.name || "";

                const teamB =
                    match.team_b?.name || "";

                const result =
                    match.result || "";

                const text = `
                    ${tournament}
                    ${teamA}
                    ${teamB}
                    ${result}
                `.toLowerCase();

                return text.includes(searchText);
            });

            displayMatches(filtered);
        }
    );

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    loadMatches();
</script>

</body>
</html>
