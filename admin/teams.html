<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teams - eSports World Central</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #151b29;
            border-bottom: 1px solid #293246;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 20px;
        }

        .back {
            color: #9ba6ba;
            text-decoration: none;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 25px 20px;
        }

        .box {
            background: #151b29;
            border: 1px solid #293246;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .box h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid #303a50;
            border-radius: 9px;
            background: #0e1421;
            color: white;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 12px 18px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .message {
            margin-top: 15px;
            color: #9ba6ba;
        }

        .teams {
            display: grid;
            gap: 15px;
        }

        .team {
            background: #0e1421;
            border: 1px solid #293246;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .team img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 10px;
            background: #151b29;
        }

        .team-info {
            flex: 1;
        }

        .team-info h3 {
            margin-bottom: 5px;
        }

        .team-info p {
            color: #9ba6ba;
            font-size: 14px;
        }

        .delete {
            background: #ef4444;
        }

        .empty {
            color: #9ba6ba;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Manage Teams</h1>
    <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<main>

    <div class="box">
        <h2>Add New Team</h2>

        <form id="teamForm">

            <label>Team Name</label>
            <input
                type="text"
                id="name"
                placeholder="Example: Team X"
                required
            >

            <label>Short Name</label>
            <input
                type="text"
                id="shortName"
                placeholder="Example: TX"
            >

            <label>Country</label>
            <input
                type="text"
                id="country"
                placeholder="Example: India"
            >

            <label>Team Logo</label>
           <input
              type="file"
              id="logoFile"
              accept="image/*"
            >

            <label>Description</label>
            <textarea
                id="description"
                placeholder="Team description..."
            ></textarea>

            <button type="submit" id="addButton">
                Add Team
            </button>

            <div class="message" id="message"></div>

        </form>
    </div>

    <div class="box">
        <h2>Existing Teams</h2>

        <div id="teamsList" class="teams">
            <div class="empty">Loading teams...</div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://hoclvnypllnouypzymfx.supabase.co";
const SUPABASE_KEY = "sb_publishable_S7xT2BZ17bmFywJuUx-MTQ_N9cBTBso";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function checkAdmin() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "index.html";
        return false;
    }

    const { data, error } = await supabaseClient.rpc("is_admin");

    if (error || data !== true) {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
        return false;
    }

    return true;
}

async function loadTeams() {

    const list = document.getElementById("teamsList");

    const { data, error } = await supabaseClient
        .from("teams")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        list.innerHTML =
            '<div class="empty">Error loading teams: ' +
            error.message +
            '</div>';
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML =
            '<div class="empty">No teams added yet.</div>';
        return;
    }

    list.innerHTML = "";

    data.forEach(team => {

        const item = document.createElement("div");
        item.className = "team";

        const image = document.createElement("img");

        if (team.logo_url) {
            image.src = team.logo_url;
        } else {
            image.style.display = "none";
        }

        const info = document.createElement("div");
        info.className = "team-info";

        const title = document.createElement("h3");
        title.textContent = team.name;

        const details = document.createElement("p");

        details.textContent =
            (team.short_name || "") +
            (team.country ? " • " + team.country : "");

        info.appendChild(title);
        info.appendChild(details);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.textContent = "Delete";

        deleteButton.onclick = () => deleteTeam(team.id);

        item.appendChild(image);
        item.appendChild(info);
        item.appendChild(deleteButton);

        list.appendChild(item);
    });
}

async function deleteTeam(id) {

    if (!confirm("Delete this team?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("teams")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Delete failed: " + error.message);
        return;
    }

    loadTeams();
}

document.getElementById("teamForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const button = document.getElementById("addButton");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "Adding...";
        message.textContent = "";

        const logoFile = document.getElementById("logoFile").files[0];

        let logoUrl = "";

        if (logoFile) {
            const fileName =
                Date.now() + "-" +
                logoFile.name.replace(/[^a-zA-Z0-9._-]/g, "-");

            const { error: uploadError } = await supabaseClient
                .storage
                .from("esports-images")
                .upload("teams/" + fileName, logoFile);

            if (uploadError) {
                message.textContent =
                    "Image upload error: " + uploadError.message;
                button.disabled = false;
                button.textContent = "Add Team";
                return;
            }

            const { data: publicData } =
                supabaseClient
                    .storage
                    .from("esports-images")
                    .getPublicUrl("teams/" + fileName);

            logoUrl = publicData.publicUrl;
        }

        const team = {
            name: document.getElementById("name").value.trim(),
            short_name: document.getElementById("shortName").value.trim(),
            country: document.getElementById("country").value.trim(),
            logo_url: logoUrl,
            description: document.getElementById("description").value.trim()
        };

        const { error } = await supabaseClient
            .from("teams")
            .insert(team);

        if (error) {
            message.textContent = "Error: " + error.message;
            button.disabled = false;
            button.textContent = "Add Team";
            return;
        }

        message.textContent = "Team added successfully!";

        document.getElementById("teamForm").reset();

        button.disabled = false;
        button.textContent = "Add Team";

        loadTeams();
    }
);

async function start() {

    const allowed = await checkAdmin();

    if (allowed) {
        loadTeams();
    }
}

start();
</script>

</body>
</html>
