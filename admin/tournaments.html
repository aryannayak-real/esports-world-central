<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: #ffffff;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .card {
            background: #151b29;
            border: 1px solid #273043;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0f1420;
            color: white;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        label {
            font-size: 14px;
            color: #d1d5db;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            background: #374151;
            margin-bottom: 20px;
        }

        .delete {
            background: #dc2626;
        }

        .tournament {
            border: 1px solid #273043;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            background: #101622;
        }

        .tournament-name {
            font-size: 19px;
            font-weight: bold;
        }

        .tournament-info {
            color: #9ca3af;
            margin-top: 8px;
            line-height: 1.7;
        }

        .empty {
            color: #9ca3af;
            text-align: center;
            padding: 20px;
        }

        #status {
            margin-bottom: 15px;
            color: #60a5fa;
        }
    </style>
</head>

<body>

<div class="container">

    <button class="back" onclick="window.location.href='dashboard.html'">
        ← Back to Dashboard
    </button>

    <h1>Tournaments Management</h1>

    <div class="subtitle">
        Add and manage esports tournaments
    </div>

    <div id="status"></div>

    <div class="card">

        <h2>Add Tournament</h2>

        <form id="tournamentForm">

            <label>Tournament Name</label>
            <input
                type="text"
                id="name"
                placeholder="Example: BGMI India Series"
                required
            >

            <label>Organizer</label>
            <input
                type="text"
                id="organizer"
                placeholder="Example: Krafton"
            >

            <label>Start Date</label>
            <input
                type="date"
                id="start_date"
            >

            <label>End Date</label>
            <input
                type="date"
                id="end_date"
            >

            <label>Prize Pool</label>
            <input
                type="text"
                id="prize_pool"
                placeholder="Example: ₹1 Crore"
            >

            <label>Location</label>
            <input
                type="text"
                id="location"
                placeholder="Example: Mumbai, India"
            >

            <label>Description</label>
            <textarea
                id="description"
                placeholder="Write a short tournament description..."
            ></textarea>

            <button type="submit">
                Add Tournament
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Existing Tournaments</h2>

        <div id="tournamentsList">
            <div class="empty">
                Loading tournaments...
            </div>
        </div>

    </div>

</div>

<script>
const SUPABASE_URL = "https://hoclvnypllnouypzymfx.supabase.co";
const SUPABASE_KEY = "sb_publishable_S7xT2BZ17bmFywJuUx-MTQ_N9cBTBso";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function checkAdmin() {

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        window.location.href = "index.html";
        return false;
    }

    const { data: adminData, error: adminError } =
        await supabaseClient.rpc("is_admin");

    if (adminError || adminData !== true) {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

        return false;
    }

    document.getElementById("status").textContent =
        "Authenticated as admin: " + userData.user.email;

    return true;
}


async function loadTournaments() {

    const { data, error } = await supabaseClient
        .from("tournaments")
        .select("*")
        .order("start_date", { ascending: false });

    if (error) {

        document.getElementById("tournamentsList").innerHTML =
            '<div class="empty">Error: ' +
            escapeHtml(error.message) +
            '</div>';

        return;
    }

    const list = document.getElementById("tournamentsList");

    if (!data || data.length === 0) {

        list.innerHTML =
            '<div class="empty">No tournaments added yet.</div>';

        return;
    }

    list.innerHTML = "";

    data.forEach(tournament => {

        const div = document.createElement("div");

        div.className = "tournament";

        div.innerHTML = `
            <div class="tournament-name">
                ${escapeHtml(tournament.name)}
            </div>

            <div class="tournament-info">

                <strong>Organizer:</strong>
                ${escapeHtml(tournament.organizer || "-")}
                <br>

                <strong>Start:</strong>
                ${escapeHtml(tournament.start_date || "-")}
                <br>

                <strong>End:</strong>
                ${escapeHtml(tournament.end_date || "-")}
                <br>

                <strong>Prize Pool:</strong>
                ${escapeHtml(tournament.prize_pool || "-")}
                <br>

                <strong>Location:</strong>
                ${escapeHtml(tournament.location || "-")}

            </div>

            <br>

            <button
                class="delete"
                onclick="deleteTournament(${tournament.id})"
            >
                Delete
            </button>
        `;

        list.appendChild(div);
    });
}


async function deleteTournament(id) {

    if (!confirm("Delete this tournament?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("tournaments")
        .delete()
        .eq("id", id);

    if (error) {

        alert("Delete failed: " + error.message);

        return;
    }

    loadTournaments();
}


document
    .getElementById("tournamentForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const tournament = {

            name:
                document.getElementById("name").value.trim(),

            organizer:
                document.getElementById("organizer").value.trim(),

            start_date:
                document.getElementById("start_date").value || null,

            end_date:
                document.getElementById("end_date").value || null,

            prize_pool:
                document.getElementById("prize_pool").value.trim(),

            location:
                document.getElementById("location").value.trim(),

            description:
                document.getElementById("description").value.trim()
        };

        const { error } = await supabaseClient
            .from("tournaments")
            .insert([tournament]);

        if (error) {

            alert(
                "Error adding tournament: " +
                error.message
            );

            return;
        }

        alert("Tournament added successfully!");

        document.getElementById("tournamentForm").reset();

        loadTournaments();
    });


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function init() {

    const allowed = await checkAdmin();

    if (!allowed) {
        return;
    }

    await loadTournaments();
}

init();
</script>

</body>
</html>
