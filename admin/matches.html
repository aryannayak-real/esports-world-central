<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches Management</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: #ffffff;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .card {
            background: #151b29;
            border: 1px solid #273043;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0f1420;
            color: white;
            font-size: 15px;
        }

        label {
            font-size: 14px;
            color: #d1d5db;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            background: #374151;
            margin-bottom: 20px;
        }

        .delete {
            background: #dc2626;
        }

        .match {
            border: 1px solid #273043;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            background: #101622;
        }

        .match-title {
            font-size: 19px;
            font-weight: bold;
        }

        .match-info {
            color: #9ca3af;
            margin-top: 8px;
            line-height: 1.7;
        }

        .empty {
            color: #9ca3af;
            text-align: center;
            padding: 20px;
        }

        #status {
            margin-bottom: 15px;
            color: #60a5fa;
        }
    </style>
</head>

<body>

<div class="container">

    <button class="back" onclick="window.location.href='dashboard.html'">
        ← Back to Dashboard
    </button>

    <h1>Matches Management</h1>

    <div class="subtitle">
        Create and manage esports matches
    </div>

    <div id="status"></div>

    <div class="card">

        <h2>Add Match</h2>

        <form id="matchForm">

            <label>Tournament</label>
            <select id="tournament_id" required>
                <option value="">Select Tournament</option>
            </select>

            <label>Team A</label>
            <select id="team_a_id" required>
                <option value="">Select Team A</option>
            </select>

            <label>Team B</label>
            <select id="team_b_id" required>
                <option value="">Select Team B</option>
            </select>

            <label>Match Date & Time</label>
            <input
                type="datetime-local"
                id="match_date"
                required
            >

            <label>Result</label>
            <input
                type="text"
                id="result"
                placeholder="Example: GodLike won 2-1"
            >

            <button type="submit">
                Add Match
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Existing Matches</h2>

        <div id="matchesList">
            <div class="empty">
                Loading matches...
            </div>
        </div>

    </div>

</div>

<script>
const SUPABASE_URL = "https://hoclvnypllnouypzymfx.supabase.co";
const SUPABASE_KEY = "sb_publishable_S7xT2BZ17bmFywJuUx-MTQ_N9cBTBso";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function checkAdmin() {

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        window.location.href = "index.html";
        return false;
    }

    const { data: adminData, error: adminError } =
        await supabaseClient.rpc("is_admin");

    if (adminError || adminData !== true) {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

        return false;
    }

    document.getElementById("status").textContent =
        "Authenticated as admin: " + userData.user.email;

    return true;
}


async function loadTournaments() {

    const { data, error } = await supabaseClient
        .from("tournaments")
        .select("id, name")
        .order("name");

    if (error) {

        alert(
            "Error loading tournaments: " +
            error.message
        );

        return;
    }

    const select = document.getElementById("tournament_id");

    select.innerHTML =
        '<option value="">Select Tournament</option>';

    data.forEach(tournament => {

        const option = document.createElement("option");

        option.value = tournament.id;
        option.textContent = tournament.name;

        select.appendChild(option);
    });
}


async function loadTeams() {

    const { data, error } = await supabaseClient
        .from("teams")
        .select("id, name")
        .order("name");

    if (error) {

        alert(
            "Error loading teams: " +
            error.message
        );

        return;
    }

    const teamA =
        document.getElementById("team_a_id");

    const teamB =
        document.getElementById("team_b_id");

    teamA.innerHTML =
        '<option value="">Select Team A</option>';

    teamB.innerHTML =
        '<option value="">Select Team B</option>';

    data.forEach(team => {

        const optionA =
            document.createElement("option");

        optionA.value = team.id;
        optionA.textContent = team.name;

        teamA.appendChild(optionA);

        const optionB =
            document.createElement("option");

        optionB.value = team.id;
        optionB.textContent = team.name;

        teamB.appendChild(optionB);
    });
}


async function loadMatches() {

    const { data, error } = await supabaseClient
        .from("matches")
        .select(`
            id,
            match_date,
            result,
            tournaments (
                name
            ),
            team_a:teams!matches_team_a_id_fkey (
                name
            ),
            team_b:teams!matches_team_b_id_fkey (
                name
            )
        `)
        .order("match_date", { ascending: false });

    if (error) {

        document.getElementById("matchesList").innerHTML =
            '<div class="empty">Error: ' +
            escapeHtml(error.message) +
            '</div>';

        return;
    }

    const list =
        document.getElementById("matchesList");

    if (!data || data.length === 0) {

        list.innerHTML =
            '<div class="empty">No matches added yet.</div>';

        return;
    }

    list.innerHTML = "";

    data.forEach(match => {

        const div = document.createElement("div");

        div.className = "match";

        const tournament =
            match.tournaments
                ? match.tournaments.name
                : "No Tournament";

        const teamA =
            match.team_a
                ? match.team_a.name
                : "Unknown Team";

        const teamB =
            match.team_b
                ? match.team_b.name
                : "Unknown Team";

        const matchDate =
            match.match_date
                ? new Date(match.match_date).toLocaleString()
                : "-";

        div.innerHTML = `
            <div class="match-title">
                ${escapeHtml(teamA)}
                vs
                ${escapeHtml(teamB)}
            </div>

            <div class="match-info">

                <strong>Tournament:</strong>
                ${escapeHtml(tournament)}
                <br>

                <strong>Date:</strong>
                ${escapeHtml(matchDate)}
                <br>

                <strong>Result:</strong>
                ${escapeHtml(match.result || "Not played")}

            </div>

            <br>

            <button
                class="delete"
                onclick="deleteMatch(${match.id})"
            >
                Delete
            </button>
        `;

        list.appendChild(div);
    });
}


async function deleteMatch(id) {

    if (!confirm("Delete this match?")) {
        return;
    }

    const { error } = await supabaseClient
        .from("matches")
        .delete()
        .eq("id", id);

    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;
    }

    loadMatches();
}


document
    .getElementById("matchForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const teamA =
            Number(
                document.getElementById("team_a_id").value
            );

        const teamB =
            Number(
                document.getElementById("team_b_id").value
            );

        if (teamA === teamB) {

            alert(
                "Team A and Team B must be different."
            );

            return;
        }

        const match = {

            tournament_id:
                Number(
                    document.getElementById(
                        "tournament_id"
                    ).value
                ),

            team_a_id: teamA,

            team_b_id: teamB,

            match_date:
                document.getElementById(
                    "match_date"
                ).value || null,

            result:
                document.getElementById(
                    "result"
                ).value.trim()
        };

        const { error } = await supabaseClient
            .from("matches")
            .insert([match]);

        if (error) {

            alert(
                "Error adding match: " +
                error.message
            );

            return;
        }

        alert("Match added successfully!");

        document
            .getElementById("matchForm")
            .reset();

        loadMatches();
    });


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function init() {

    const allowed = await checkAdmin();

    if (!allowed) {
        return;
    }

    await loadTournaments();
    await loadTeams();
    await loadMatches();
}

init();
</script>

</body>
</html>
