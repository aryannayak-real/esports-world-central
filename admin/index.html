<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - eSports World Central</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #151b29;
            border: 1px solid #293246;
            border-radius: 18px;
            padding: 32px 24px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9ba6ba;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #303a50;
            border-radius: 10px;
            background: #0e1421;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #ff8a8a;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #9ba6ba;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>eSports World Central</h1>
    <div class="subtitle">Admin Panel</div>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Admin email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

        <div class="message" id="message"></div>

    </form>

    <a class="back" href="../index.html">
        ← Back to website
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://hoclvnypllnouypzymfx.supabase.co";
const SUPABASE_KEY = "sb_publishable_S7xT2BZ17bmFywJuUx-MTQ_N9cBTBso";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Logging in...";

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Login";
        return;
    }

    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
