<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>eSports World Central</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: #111118;
            border-bottom: 1px solid #292933;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            color: #999;
            margin-top: 12px;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 28px;
        }

        .section-title p {
            color: #888;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(260px, 1fr)
            );
            gap: 20px;
        }

        .game-card {
            background: #15151c;
            border: 1px solid #292933;
            border-radius: 14px;
            padding: 30px;
            text-align: center;
        }

        .game-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .game-card h3 {
            margin: 10px 0;
            font-size: 24px;
        }

        .game-card p {
            color: #999;
            line-height: 1.5;
        }

        .game-card a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background: #22222b;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            text-decoration: none;
        }

        .game-card a:hover {
            background: #2d2d38;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
            border-top: 1px solid #24242d;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>eSports World Central</h1>
    <p>Your central hub for competitive esports information</p>
</header>

<div class="container">

    <div class="section-title">
        <h2>Games</h2>
        <p>Select an esports game to explore</p>
    </div>

    <div class="games">

        <div class="game-card">

            <div class="game-icon">
                🎮
            </div>

            <h3>BGMI</h3>

            <p>
                Explore BGMI teams, players, tournaments,
                matches, statistics, transfers and history.
            </p>

            <a href="bgmi/">
                Explore BGMI
            </a>

        </div>

    </div>

</div>

<footer>
    © 2026 eSports World Central
</footer>

</body>
</html>
